<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Rounded Square Badge Frame -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="3" />
  
  <!-- Upward Arrow Shaft (Piercing Beam) -->
  <rect x="29" y="24" width="6" height="24" fill="#FFFFFF" rx="2" />
  
  <!-- Piercing Arrow Tip -->
  <path d="M 32 12 L 44 26 L 20 26 Z" fill="#FFFFFF" />

  <!-- Shattered Brick Fragments / Impact Flashes -->
  <!-- Left Side Debris -->
  <rect x="14" y="18" width="5" height="5" fill="#FFFFFF" rx="1" transform="rotate(15 16.5 20.5)" />
  <rect x="12" y="32" width="4" height="4" fill="#FFFFFF" rx="1" transform="rotate(-20 14 34)" />

  <!-- Right Side Debris -->
  <rect x="45" y="18" width="5" height="5" fill="#FFFFFF" rx="1" transform="rotate(-15 47.5 20.5)" />
  <rect x="48" y="32" width="4" height="4" fill="#FFFFFF" rx="1" transform="rotate(20 50 34)" />
</svg>
