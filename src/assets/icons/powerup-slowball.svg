<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Rounded Square Badge Frame -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="3" />

  <!-- Tortoise Body Group (Vertically & Horizontally Balanced) -->
  <!-- Shell Dome -->
  <path d="M 18 35 C 18 17, 46 17, 46 35 Z" fill="#FFFFFF" />

  <!-- Shell Rim / Base Plate -->
  <rect x="15" y="34" width="34" height="4" rx="2" fill="#FFFFFF" />

  <!-- Head Extending Right -->
  <path d="M 46 29 Q 56 27 54 35 Q 48 37 46 34 Z" fill="#FFFFFF" />
  <!-- Eye -->
  <circle cx="51" cy="30" r="1.5" fill="#1A1A1A" />

  <!-- Front & Back Stubby Legs -->
  <path d="M 21 38 L 19 44 L 26 44 L 26 38 Z" fill="#FFFFFF" />
  <path d="M 37 38 L 37 44 L 44 44 L 42 38 Z" fill="#FFFFFF" />

  <!-- Tail -->
